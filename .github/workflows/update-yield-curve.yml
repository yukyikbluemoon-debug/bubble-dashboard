name: Update Yield Curve Data

on:
  schedule:
    # Every Monday 02:00 UTC (~09:00 ICT) — FRED updates daily on business days
    - cron: "0 2 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update script
        run: python3 scripts/update_yield_curve.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/bubble-data-us.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "bubble-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bubble-data-us.json
          git commit -m "Auto-update yield curve from FRED [skip ci]"
          git push
